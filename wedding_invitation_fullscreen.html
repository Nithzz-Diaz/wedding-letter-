<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--gold:#e8b455;--gold2:#f6d58a;--deep:#1a0f06;--cream:#f8ecd2;--ink:#5a3a14}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;width:100%;background:#0d0703;font-family:'Cormorant Garamond',serif;color:var(--cream)}
body{overflow-x:hidden}
.pg{display:none;position:relative;width:100%;max-width:none;min-height:100vh;min-height:100svh;margin:0 auto;overflow:hidden}
.pg.on{display:block;animation:fade .7s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.script{font-family:'Great Vibes',cursive;font-weight:400}
.cap{font-family:'Cinzel',serif;letter-spacing:.3em;text-transform:uppercase}
.center{text-align:center;position:relative;z-index:3;padding:0 22px}
/* roses */
.rose{position:absolute;border-radius:50%;z-index:2;background:radial-gradient(circle at 35% 30%,#fffaf0,#f7e2b0 40%,#d9b068 75%,#9c7330);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25),inset 0 0 0 9px rgba(156,115,48,.18),inset 0 0 0 15px rgba(255,250,235,.22),0 4px 14px rgba(0,0,0,.4)}
.leaf{position:absolute;width:46px;height:20px;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#6b6a2c,#3b3a14);z-index:1;opacity:.8}
/* page1 */
#p1{background:radial-gradient(ellipse at 50% 30%,#4a2e10 0,#22130a 45%,#0d0703 100%)}
#p1:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 100%,rgba(246,213,138,.35),transparent 45%)}
.lights{position:absolute;top:0;left:0;right:0;height:210px;z-index:2;pointer-events:none}
.lights i{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe7a8;box-shadow:0 0 10px 3px rgba(255,205,100,.9);animation:tw 2.4s infinite}
@keyframes tw{50%{opacity:.35;transform:scale(.7)}}
.rings{width:78px;height:54px;margin:0 auto;position:relative;filter:drop-shadow(0 0 10px var(--gold))}
.rings:before,.rings:after{content:"";position:absolute;width:44px;height:44px;border:4px solid var(--gold);border-radius:50%;top:5px}
.rings:before{left:2px}.rings:after{left:30px}
.rule{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--gold);font-size:13px}
.rule:before,.rule:after{content:"";height:1px;background:linear-gradient(90deg,transparent,var(--gold));flex:1}
.rule:after{background:linear-gradient(270deg,transparent,var(--gold))}
.names{font-size:clamp(54px,8vw,100px);line-height:1.05;color:var(--gold2);text-shadow:0 0 22px rgba(232,180,85,.6)}
.btn{display:inline-block;padding:15px 38px;border-radius:40px;border:2px solid var(--gold);background:rgba(20,10,4,.4);color:var(--gold2);font:500 21px 'Cormorant Garamond',serif;cursor:pointer;box-shadow:0 0 18px rgba(232,180,85,.7),inset 0 0 14px rgba(232,180,85,.25);animation:glow 2.6s infinite}
@keyframes glow{50%{box-shadow:0 0 30px rgba(246,213,138,.95),inset 0 0 18px rgba(232,180,85,.4)}}
.lantern{position:absolute;bottom:40px;width:52px;height:86px;border:3px solid #8a6424;border-radius:8px 8px 4px 4px;background:radial-gradient(circle at 50% 70%,#fff0b8,#e0a640 50%,#5a3a10);box-shadow:0 0 30px 8px rgba(255,190,80,.6);z-index:2}
.arrow{position:absolute;bottom:12px;left:50%;color:var(--gold);animation:bob 1.6s infinite;z-index:3}
@keyframes bob{50%{transform:translateY(6px)}}
/* page2 */
#p2{background:radial-gradient(ellipse at 50% 0,#fff6e2,#f3dfb6 60%,#e6c98c);color:var(--ink);padding:0 0 30px;min-height:100vh;min-height:100svh}
#p2 .center{width:100%;max-width:1120px;margin:0 auto;padding:clamp(42px,7vh,76px) clamp(18px,4vw,54px) 42px}
#p2 h2{font-size:clamp(38px,5vw,58px);color:#6b4a1c;font-weight:400;margin:8px 0 18px}
.row{display:flex;gap:clamp(18px,4vw,48px);align-items:center;justify-content:center;margin:24px auto 28px;text-align:left;max-width:850px}
.msg{flex:1.1;font-style:italic;font-size:clamp(18px,2vw,23px);line-height:1.5;white-space:pre-line}
.sign{font-size:30px;margin-top:10px;line-height:1.1}
.polaroid{flex:0 1 290px;background:#fff;padding:7px 7px 22px;transform:rotate(3deg);box-shadow:0 8px 22px rgba(80,50,10,.35);min-height:190px}
.ph{width:100%;aspect-ratio:3/4;background:linear-gradient(160deg,#f0c98a,#a9774a);background-size:cover;background-position:center;display:grid;place-items:center;font-size:34px}
.tabs{display:flex;gap:12px;margin:22px auto 14px;max-width:760px}
.tab{flex:1;padding:13px 8px;border-radius:40px;border:1px solid #b98a3c;background:rgba(110,80,50,.8);color:#fbe9c4;font:500 18px 'Cormorant Garamond',serif;cursor:pointer;transition:.3s}
.tab.on{background:linear-gradient(#f3c570,#c98f2c);color:#4a2d08;box-shadow:0 0 18px rgba(232,170,60,.8)}
#det{transition:opacity .25s;max-width:900px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:rgba(255,250,236,.8);border:1px solid #e0c58e;border-radius:8px;padding:14px 8px;font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.card b{display:block;font-size:22px;margin-bottom:2px}
.evt{width:100%;max-width:760px;aspect-ratio:16/7;margin:18px auto;border-radius:10px;background-size:cover;background-position:center;background-color:#d9b068;display:grid;place-items:center;font-size:40px;border:3px solid #fff;box-shadow:0 6px 18px rgba(80,50,10,.3)}
.btn.dark{border-color:#b98a3c;color:#5a3a14;background:rgba(255,250,236,.7);font-size:18px;padding:11px 28px;animation:none;box-shadow:0 2px 10px rgba(150,100,30,.3)}
.foot{margin-top:24px;font-size:23px;font-style:italic;color:#6b4a1c}
/* page3 */
#p3{background:radial-gradient(ellipse at 50% 20%,#3d2610,#170d05 60%,#0a0503);min-height:100vh;min-height:100svh;padding:28px 18px 60px}
#p3>.center{width:100%;max-width:560px;margin:0 auto;padding:clamp(18px,5vh,55px) 22px 35px}
.lock{width:76px;height:84px;margin:26px auto 4px;position:relative}
.lock:before{content:"";position:absolute;left:12px;top:0;width:52px;height:50px;border:9px solid var(--gold);border-bottom:0;border-radius:28px 28px 0 0;filter:drop-shadow(0 0 10px var(--gold))}
.lock:after{content:"🔑";position:absolute;left:0;top:34px;width:76px;height:50px;border-radius:10px;background:linear-gradient(#f9dd96,#d79a35);box-shadow:0 0 28px rgba(246,200,100,.9);display:grid;place-items:center;font-size:0;background-image:radial-gradient(circle at 50% 38%,#4a2d08 6px,transparent 7px),linear-gradient(#f9dd96,#d79a35)}
.field{display:block;width:100%;margin:14px 0;padding:16px 20px;border-radius:30px;border:1px solid rgba(232,180,85,.7);background:rgba(20,10,4,.6);color:var(--cream);font:19px 'Cormorant Garamond',serif;outline:none}
.field:focus{box-shadow:0 0 14px rgba(232,180,85,.7)}
.warn{font-style:italic;color:var(--gold2);font-size:17px;margin-top:20px}
.err{color:#ff9d8a;min-height:22px;font-size:16px}
#dash{padding:26px 18px 60px;position:relative;z-index:3;text-align:left;max-width:900px;margin:0 auto}
#dash h3{font:400 30px 'Great Vibes';color:var(--gold2);margin:26px 0 4px}
#dash label{font-size:15px;color:var(--gold);display:block;margin-top:10px}
#dash .field{border-radius:12px;padding:11px 14px;margin:4px 0;font-size:17px}
#dash .btn{font-size:18px;padding:12px 30px;margin-top:14px}
.thumb{height:70px;width:100px;background-size:cover;border-radius:6px;margin:6px 0;background-color:#3a2410}
/* full-screen responsive layout */
@media(min-width:700px){
  #p1 .center{max-width:1120px;margin:0 auto}
  #p1 .names{font-size:clamp(76px,8vw,112px)}
  #p1 .lantern{bottom:54px}
  #p2 .row{min-height:250px}
  #p2 .ph{max-height:320px}
  #p3 #login{padding:10px 34px 25px}
}
@media(max-width:600px){
  #p1 .center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;min-height:100svh;padding:76px 20px 112px!important}
  #p1 .names{font-size:clamp(48px,15vw,72px);overflow-wrap:anywhere}
  #p1 .cap{letter-spacing:.2em}
  #p1 .lantern{width:38px;height:66px;bottom:24px}
  #p1 .lantern[style*="right"]{height:58px}
  #p2 .center{padding:42px 16px 32px}
  #p2 .row{gap:14px;margin:18px auto 24px;align-items:center}
  .msg{font-size:17px}
  .polaroid{flex:0 0 42%;min-height:0;padding:5px 5px 16px}
  .tabs{gap:8px}
  .tab{font-size:16px;padding:12px 5px}
  .cards{gap:6px}
  .card{font-size:14px;padding:11px 4px}
  .card b{font-size:18px}
  .evt{aspect-ratio:16/10}
  #p3{padding:14px 12px 40px}
  #p3>.center{padding:22px 10px}
}
@media(max-width:380px){
  #p1 .names{font-size:46px}
  #p1 .center{padding-left:14px!important;padding-right:14px!important}
  #p2 .row{flex-direction:column}
  .polaroid{width:58%;max-width:230px;flex:auto}
  .cards{grid-template-columns:1fr}
  .card{text-align:center}
  .tabs{flex-direction:column}
  .tab{width:100%}
  #p2 h2{font-size:36px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- PAGE 1 -->
<section class="pg" id="p1">
  <div class="lights" id="lights"></div>
  <div class="center" style="padding-top:150px;min-height:100vh">
    <div class="rings"></div>
    <div class="rule cap" style="font-size:13px;margin-top:22px">Together Forever</div>
    <div class="names script" style="margin:22px 0 4px"><span data-k="bride"></span> &amp; <span data-k="groom"></span></div>
    <div style="color:var(--gold);font-size:30px;text-shadow:0 0 10px var(--gold)">♡</div>
    <div class="cap" style="font-size:15px;margin:26px 0 12px;color:var(--gold2)">Are Getting Married!</div>
    <div class="rule">♥</div>
    <div class="cap" style="font-size:16px;margin:16px 0;color:var(--gold2)">📅 <span data-k="date"></span></div>
    <p style="font-style:italic;font-size:24px;line-height:1.3;color:var(--gold2);margin:8px 18px 18px" data-k="invite_msg"></p>
    <div class="rule">♡</div>
    <div style="margin-top:26px"><button class="btn" id="open">Open Invitation &nbsp;›</button></div>
  </div>
  <div class="lantern" style="left:34px"></div><div class="lantern" style="right:34px;height:74px"></div>
  <div class="arrow">⌄</div>
  <div class="roses" data-roses="p1"></div>
</section>

<!-- PAGE 2 -->
<section class="pg" id="p2">
  <div class="center">
    <div class="rule" style="color:#b98a3c">♡</div>
    <h2 class="script">Our Wedding Celebration</h2>
    <div class="row">
      <div class="msg"><span data-k="cel_msg"></span><div class="sign script" data-k="signoff"></div></div>
      <div class="polaroid"><div class="ph" data-img="couple_photo">💑</div></div>
    </div>
    <div class="tabs">
      <button class="tab on" data-ev="wedding">💍 Wedding Details</button>
      <button class="tab" data-ev="roce">✝ Roce Details</button>
    </div>
    <div id="det">
      <div class="cards">
        <div class="card">📅<b></b>Date<br><span id="d-date"></span></div>
        <div class="card">🕕<b></b>Time<br><span id="d-time"></span></div>
        <div class="card">📍<b></b>Venue<br><span id="d-venue"></span></div>
      </div>
      <div class="evt" id="d-photo"></div>
      <a class="btn dark" id="d-map" target="_blank" rel="noopener">📍 Get Directions</a>
    </div>
    <div class="foot">Let's celebrate love together! ♡</div>
  </div>
  <div class="roses" data-roses="p2"></div>
</section>

<!-- PAGE 3: private admin route -->
<section class="pg" id="p3">
  <div class="center">
    <div class="rings"></div>
    <div id="login">
      <div class="lock"></div>
      <div class="names script" style="font-size:58px;margin-top:20px">Admin Access</div>
      <p style="margin:8px 0 22px;font-size:18px">Enter your credentials to continue</p>
      <input class="field" id="u" type="email" placeholder="Username (email)" autocomplete="username">
      <input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password">
      <div class="err" id="err"></div>
      <button class="btn" id="go" style="background:linear-gradient(#f9d98a,#d79a35);color:#3a2308">Login &nbsp;›</button>
      <div class="rule" style="margin-top:26px">♡</div>
      <p class="warn">Unauthorized access is prohibited.</p>
    </div>
  </div>
  <div id="dash" hidden></div>
  <div class="roses" data-roses="p3"></div>
</section>

<script>
/* ===== 1. PASTE YOUR SUPABASE DETAILS HERE (anon key only, never service_role) ===== */
const SB_URL = "YOUR_SUPABASE_URL";
const SB_KEY = "YOUR_SUPABASE_ANON_KEY";

const sb = (SB_URL.startsWith("http")) ? supabase.createClient(SB_URL, SB_KEY) : null;
const DEFAULTS = {
  bride:"Riya", groom:"Arjun", date:"December 20, 2026",
  invite_msg:"You're warmly invited to be a part of our special day!",
  couple_photo:"",
  cel_msg:"Two hearts, one journey,\na lifetime of love.\n\nWe're so excited to start this next chapter together and would be honoured to have you with us on our special day.",
  signoff:"With love, Riya & Arjun ♡",
  wedding:{date:"Dec 20, 2026",time:"6:00 PM Onwards",venue:"Grand Palace, Bangalore",photo:"",maps:""},
  roce:{date:"Dec 19, 2026",time:"11:00 AM Onwards",venue:"Grand Palace Garden, Bangalore",photo:"",maps:""}
};
let C = JSON.parse(JSON.stringify(DEFAULTS)), ev = "wedding";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const get = (o,p) => p.split(".").reduce((a,k)=>a&&a[k],o);
const set = (o,p,v) => { const a=p.split("."),l=a.pop(); a.reduce((x,k)=>x[k]=x[k]||{},o)[l]=v; };
const merge = (a,b) => { for(const k in b){ if(b[k]&&typeof b[k]==="object") merge(a[k]=a[k]||{},b[k]); else if(b[k]!==""&&b[k]!=null) a[k]=b[k]; } return a; };

/* ===== decorations ===== */
(function deco(){
  const L=$("#lights");
  for(let s=0;s<2;s++) for(let i=0;i<22;i++){
    const x=i/21, y=(s?30:8)+Math.sin(x*Math.PI*3+s)*14+x*(s?50:90);
    const d=document.createElement("i"); d.style.cssText=`left:${x*100}%;top:${y}px;animation-delay:${(i*.37)%2.4}s`; L.appendChild(d);
  }
  const spots={
    p1:[[-30,-20,110],[40,-40,80],[-35,90,90],[-20,230,70],[-30,300,80],[-40,520,100],[-20,640,90],[-10,-1,110,'b'],[330,-30,90,'r'],[340,160,70,'r'],[360,330,80,'r'],[350,540,100,'r']],
    p2:[[-30,-20,110],[50,-30,80],[-35,100,70],[330,-30,90,'r'],[350,80,60,'r'],[-30,'b',110],['r','b',120]],
    p3:[[-30,-20,90],[55,-35,70],['r','b',120],[300,'b',90]]
  };
  $$("[data-roses]").forEach(box=>{
    const pg=box.closest(".pg");
    (spots[box.dataset.roses]||[]).forEach(([x,y,s])=>{
      const r=document.createElement("div"); r.className="rose";
      r.style.width=r.style.height=s+"px";
      r.style[x==="r"?"right":"left"]=(x==="r"?-30:x)+"px";
      r.style[y==="b"?"bottom":"top"]=(y==="b"?-30:y)+"px";
      pg.appendChild(r);
      const l=document.createElement("div"); l.className="leaf";
      l.style.cssText=`${x==="r"?"right":"left"}:${(x==="r"?0:+x||0)+s*.6}px;${y==="b"?"bottom":"top"}:${(y==="b"?0:+y||0)+s*.7}px;transform:rotate(${(s*7)%90}deg)`;
      pg.appendChild(l);
    });
  });
})();

/* ===== render ===== */
function render(){
  $$("[data-k]").forEach(e=>e.textContent=C[e.dataset.k]||"");
  $$("[data-img]").forEach(e=>{ const u=C[e.dataset.img]; e.style.backgroundImage=u?`url("${u}")`:""; if(u) e.textContent=""; });
  showEv();
}
function showEv(){
  const d=$("#det"), e=C[ev]||{};
  $$(".tab").forEach(t=>t.classList.toggle("on",t.dataset.ev===ev));
  d.style.opacity=0;
  setTimeout(()=>{
    $("#d-date").textContent=e.date||""; $("#d-time").textContent=e.time||""; $("#d-venue").textContent=e.venue||"";
    const p=$("#d-photo"); p.style.backgroundImage=e.photo?`url("${e.photo}")`:""; p.textContent=e.photo?"":(ev==="wedding"?"💍":"✝");
    const m=$("#d-map"); m.style.display=e.maps?"inline-block":"none"; if(e.maps) m.href=e.maps;
    d.style.opacity=1;
  },200);
}
$$(".tab").forEach(t=>t.onclick=()=>{ ev=t.dataset.ev; showEv(); });  // swaps content only, no navigation

async function load(){
  if(sb){ try{ const {data}=await sb.from("invitation").select("data").eq("id",1).maybeSingle(); if(data&&data.data) merge(C,data.data); }catch(e){} }
  render();
}

/* ===== page navigation ===== */
$("#open").onclick=()=>{ location.hash="celebration"; };

/* ===== routing (no public link to #admin) ===== */
function route(){
  const h=location.hash.replace("#",""), id=h==="celebration"?"p2":h==="admin"?"p3":"p1";
  $$(".pg").forEach(p=>p.classList.toggle("on",p.id===id)); window.scrollTo(0,0);
  if(id==="p3") checkSession();
}
addEventListener("hashchange",route);

/* ===== admin ===== */
const FIELDS=[
 ["Couple"],["bride","Bride name"],["groom","Groom name"],
 ["Cover page"],["date","Wedding date (as shown on cover)"],["invite_msg","Invitation message","t"],
 ["Celebration page"],["cel_msg","Personalised message","t"],["signoff","Sign-off"],["couple_photo","Couple photo","p"],
 ["Wedding"],["wedding.date","Date"],["wedding.time","Time"],["wedding.venue","Venue"],["wedding.maps","Google Maps link"],["wedding.photo","Event photo","p"],
 ["Roce"],["roce.date","Date"],["roce.time","Time"],["roce.venue","Venue"],["roce.maps","Google Maps link"],["roce.photo","Event photo","p"]
];
async function isAdmin(){
  if(!sb) return false;
  const {data:{session}}=await sb.auth.getSession(); if(!session) return false;
  const {data}=await sb.from("admins").select("user_id").eq("user_id",session.user.id).maybeSingle();
  if(!data){ await sb.auth.signOut(); return false; } return true;
}
async function checkSession(){
  const ok=await isAdmin(); $("#login").hidden=ok; $("#dash").hidden=!ok; if(ok) buildDash();
}
$("#go").onclick=async()=>{
  const err=$("#err"); err.textContent="";
  if(!sb){ err.textContent="Supabase is not connected yet. Add your URL and key in index.html."; return; }
  const {error}=await sb.auth.signInWithPassword({email:$("#u").value.trim(),password:$("#pw").value});
  if(error){ err.textContent="Invalid credentials."; return; }
  if(!(await isAdmin())){ err.textContent="Unauthorized access is prohibited."; return; }
  $("#pw").value=""; checkSession();
};
function buildDash(){
  const d=$("#dash"); d.innerHTML='<h3 style="font-size:40px;margin:0">Editing Dashboard</h3><p style="font-size:16px">Changes appear on the public invitation after you save.</p>';
  FIELDS.forEach(([k,l,t])=>{
    if(!l){ d.insertAdjacentHTML("beforeend",`<h3>${k}</h3>`); return; }
    const v=get(C,k)||"", id="f_"+k.replace(".","_");
    if(t==="p") d.insertAdjacentHTML("beforeend",`<label>${l}</label><div class="thumb" id="t_${id}" style="background-image:${v?`url('${v}')`:"none"}"></div><input type="file" accept="image/*" data-up="${k}" style="color:#f6d58a;font-size:14px">`);
    else d.insertAdjacentHTML("beforeend",`<label>${l}</label>${t?`<textarea class="field" rows="4" id="${id}">`:`<input class="field" id="${id}" value="">`}${t?"</textarea>":""}`);
    const el=$("#"+id); if(el) el.value=v;
  });
  d.insertAdjacentHTML("beforeend",'<div class="err" id="msg"></div><button class="btn" id="save">Save changes</button> <button class="btn" id="out" style="animation:none;font-size:16px">Logout</button>');
  $$("[data-up]").forEach(i=>i.onchange=async()=>{
    const f=i.files[0]; if(!f) return; const msg=$("#msg"); msg.style.color="#f6d58a"; msg.textContent="Uploading…";
    const path=`${i.dataset.up.replace(".","_")}-${Date.now()}.${f.name.split(".").pop()}`;
    const {error}=await sb.storage.from("photos").upload(path,f,{upsert:true});
    if(error){ msg.style.color="#ff9d8a"; msg.textContent="Upload failed: "+error.message; return; }
    const url=sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
    set(C,i.dataset.up,url); $("#t_f_"+i.dataset.up.replace(".","_")).style.backgroundImage=`url('${url}')`; msg.textContent="Photo uploaded. Press Save changes.";
  });
  $("#save").onclick=async()=>{
    FIELDS.forEach(([k,l,t])=>{ if(l&&t!=="p") set(C,k,$("#f_"+k.replace(".","_")).value); });
    const {error}=await sb.from("invitation").upsert({id:1,data:C,updated_at:new Date().toISOString()});
    const m=$("#msg"); m.style.color=error?"#ff9d8a":"#9be29b"; m.textContent=error?"Could not save: "+error.message:"Saved! The public invitation is updated."; render();
  };
  $("#out").onclick=async()=>{ await sb.auth.signOut(); location.hash=""; };
}

load(); route();
</script>
</body>
</html>
